<title>OKX Desk · multi-exchange signals</title>
<script>
(function () { try {
  const p = localStorage.getItem("okx_theme") || "auto";
  const h = +new Intl.DateTimeFormat("en-GB", { hour: "2-digit", hourCycle: "h23", timeZone: "Europe/Amsterdam" }).format(new Date());
  document.documentElement.dataset.theme = p === "light" || p === "dark" ? p : (h >= 22 || h < 7 ? "light" : "dark");
} catch (e) {} })();
</script>
<link rel="manifest" href="manifest.json">

<style>
:root{--bg:#07090c;--card:#11151b;--card2:#171c24;--line:#232a35;--txt:#e9edf2;--mut:#8a94a3;--grn:#2fd27a;--red:#ff5468;--amb:#ffb648;--blu:#5aa9ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;background:rgba(7,9,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:1.1rem;letter-spacing:.05em;white-space:nowrap}
.badge{white-space:nowrap}
header .upd{margin-left:auto;color:var(--mut);font-size:.8rem;text-align:right}
.badge{font-size:.7rem;font-weight:700;padding:.15rem .5rem;border-radius:99px;letter-spacing:.06em}
.b-paper{background:#2a2410;color:var(--amb);border:1px solid #5a4614}
main{max-width:1280px;margin:0 auto;padding:1rem}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:.9rem}
.card h2{margin:0 0 .6rem;font-size:1rem}.card h3{margin:.8rem 0 .4rem;font-size:.9rem}
.mut{color:var(--mut)}.sm{font-size:.82rem}.xs{font-size:.74rem}.grn{color:var(--grn)}.red{color:var(--red)}.amb{color:var(--amb)}
.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}.sp{flex:1}
.banner{border-radius:14px;padding:.75rem .9rem;margin-bottom:.7rem;font-weight:600}
.bn-red{background:#2a0f15;border:1px solid #5c1d29;color:#ffb3bd}.bn-amb{background:#2a200d;border:1px solid #5a4614;color:#ffd59a}
.bn-grn{background:#0d2219;border:1px solid #1b4a33;color:#9ff0c4}.bn-blu{background:#0e1a2a;border:1px solid #1e3a5c;color:#b5d5ff}
.banner ul{margin:.3rem 0 0;padding-left:1.1rem;font-weight:500}.banner li{margin:.15rem 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.6rem}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:.7rem;cursor:pointer;text-align:left;color:inherit;font:inherit}
.tile.sel{outline:2px solid var(--blu)}
.tile b{display:block;font-size:.95rem}.tile .px{font-size:1.05rem;font-weight:700;margin:.2rem 0}
.pill{display:inline-block;font-size:.72rem;font-weight:800;padding:.18rem .55rem;border-radius:99px;letter-spacing:.04em}
.p-long{background:#0f2a1d;color:var(--grn);border:1px solid #1d5a3b}.p-short{background:#2c1016;color:var(--red);border:1px solid #63202d}
.p-neutral{background:#222a35;color:var(--mut);border:1px solid #2c3542}.p-amb{background:#2a2410;color:var(--amb);border:1px solid #5a4614}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.tbl th{text-align:left;color:var(--mut);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:.35rem .4rem;border-bottom:1px solid var(--line)}
.tbl td{padding:.45rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}.tbl tr:last-child td{border:0}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sig{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:.7rem .8rem;margin-bottom:.55rem}
.sig .lv{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-top:.45rem}
.sig .lv div{font-size:.72rem;color:var(--mut)}.sig .lv b{display:block;font-size:.92rem;color:var(--txt);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:99px;padding:.35rem .75rem;font-size:.82rem;cursor:pointer}
.chip.on{background:#10263f;border-color:#1e4d80;color:#9cc9ff}
.btn{display:inline-block;border:0;cursor:pointer;font-weight:700;font-size:.85rem;color:#06110b;background:var(--grn);padding:.5rem .85rem;border-radius:10px}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}.btn.warn{background:var(--red);color:#fff}
input.f{font:inherit;font-size:.9rem;padding:.55rem .7rem;border-radius:.6rem;border:1px solid var(--line);background:var(--card2);color:var(--txt);min-width:0}
input.f:focus{outline:2px solid #3b82f6;outline-offset:1px}
.addrow{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}.addrow input{flex:1 1 7rem}
.rule{padding:.5rem 0;border-bottom:1px solid var(--line)}.rule:last-child{border:0}.rule b{display:block;font-size:.88rem}
.rule span{font-size:.82rem;color:var(--mut)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));z-index:20;background:#10263f;color:#cfe4ff;border:1px solid #1e4d80;border-radius:12px;padding:.6rem .9rem;font-size:.85rem;display:none;max-width:92vw}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(10,13,17,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;color:var(--mut);padding:.55rem 0 .6rem;font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}nav.tabs button.on{color:var(--txt)}
#lock{display:none;max-width:420px;margin:0 auto;padding:3rem 1rem}
#lock .card{padding:1.3rem}#lock input{width:100%;margin:.35rem 0}
.split{display:block}
html[data-theme="light"]{--bg:#f4f6f9;--card:#ffffff;--card2:#eef1f5;--line:#dde3ea;--txt:#11161d;--mut:#5d6775;--grn:#0e9f56;--red:#d42c43;--amb:#a86a0c;--blu:#1f6fd1}
html[data-theme="light"] header{background:rgba(244,246,249,.93)}html[data-theme="light"] nav.tabs{background:rgba(255,255,255,.97)}
html[data-theme="light"] .b-paper,html[data-theme="light"] .p-amb{background:#fff4dd;border-color:#f0cf8a}
html[data-theme="light"] .bn-red{background:#ffeef0;border-color:#f5b5bf;color:#9b1c2e}html[data-theme="light"] .bn-amb{background:#fff6e5;border-color:#f0d39a;color:#7a4d06}
html[data-theme="light"] .bn-grn{background:#e8f8ef;border-color:#a9e2c2;color:#0b6b3b}html[data-theme="light"] .bn-blu{background:#eaf2fd;border-color:#b5d0f3;color:#1a4f93}
html[data-theme="light"] .p-long{background:#e2f6ea;border-color:#a9e2c2}html[data-theme="light"] .p-short{background:#ffe8eb;border-color:#f5b5bf}
html[data-theme="light"] .p-neutral{background:#e8ecf1;border-color:#d3dae3}
html[data-theme="light"] .chip.on{background:#e3efff;border-color:#b5d0f3;color:#1a4f93}html[data-theme="light"] #toast{background:#e3efff;color:#1a4f93;border-color:#b5d0f3}
html[data-theme="light"] .btn{color:#fff}html[data-theme="light"] .btn.ghost{color:var(--txt)}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:.45rem .6rem;margin:.6rem 0}.lgrid label{display:flex;flex-direction:column;font-size:.72rem;color:var(--mut);gap:.15rem}
.lgrid .f,select.f{width:100%}select.f{font:inherit;font-size:.9rem;padding:.5rem;border-radius:.6rem;border:1px solid var(--line);background:var(--card2);color:var(--txt)}
@media (min-width:960px){.lgrid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:420px){nav.tabs button{font-size:.58rem;padding:.45rem 0 .5rem}nav.tabs button svg{width:18px;height:18px}}
.exsel{font:inherit;font-weight:800;font-size:.95rem;letter-spacing:.04em;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:.2rem .3rem}
header h1{margin-left:-.2rem}
#theme{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:99px;font-size:.72rem;padding:.2rem .6rem;cursor:pointer}
@media (min-width:960px){
  body{padding-bottom:0}
  nav.tabs{position:sticky;top:53px;bottom:auto;justify-content:center;border-top:0;border-bottom:1px solid var(--line);background:var(--bg)}
  nav.tabs button{flex:none;width:130px;flex-direction:row;justify-content:center;gap:.4rem;font-size:.85rem;padding:.7rem 0}
  nav.tabs button svg{width:18px;height:18px}
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:start}
  #toast{bottom:1.2rem}
}

/* Dashboard + coin page — Bloomberg / desk-floor terminal look */
.term{--tbg:#05070a;--tpanel:#0b0f14;--tline:#1c2430;--tmut:#7d8a9a;--tacc:#3dffa8;--tamb:#ffb648;--tred:#ff5468;--tblu:#5aa9ff;--tpur:#b388ff}

.check li:last-child{border:0}.check .box{flex:none;width:14px;height:14px;border:1px solid #3a4656;border-radius:3px;margin-top:1px;display:inline-flex;align-items:center;justify-content:center;font-size:10px}

.bankchart,.livechart{width:100%;height:140px;background:#070b10;border:1px solid #141b24;border-radius:8px;overflow:hidden}
.livechart{height:180px}
.tfmini{display:flex;flex-wrap:wrap;gap:.25rem;margin:.3rem 0}
.tfmini button{font:10px ui-monospace,Menlo,monospace;padding:.2rem .45rem;border-radius:5px;border:1px solid var(--tline);background:#10161e;color:#9eb0c3;cursor:pointer}

.tlog{height:78px;overflow:hidden;background:#000;border:1px solid var(--tline);border-radius:10px;margin-top:.55rem;position:relative}
.tlog-inner{padding:.35rem .55rem;font:10px/1.45 ui-monospace,Menlo,monospace;color:#8fa0b3;animation:tscroll 28s linear infinite}
@keyframes tscroll{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
.tlog .ev-g{color:var(--tacc)}.tlog .ev-r{color:var(--tred)}.tlog .ev-a{color:var(--tamb)}
.navbands{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0}

.dcards{display:flex;flex-direction:column;gap:.7rem}
.dcard{display:block;width:100%;text-align:left;background:var(--tpanel);border:1px solid var(--tline);border-radius:12px;padding:.85rem 1rem;color:inherit;font:inherit;cursor:pointer}

<header>
  <select id="exSel" class="exsel" aria-label="Exchange"><option value="okx">OKX</option><option value="bybit">Bybit</option><option value="kraken">Kraken</option></select><h1>DESK</h1><span class="badge b-paper">SIGNALS · PAPER</span>

function beep() { if (!sound) return; try { actx = actx || new AudioContext(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + .25); } catch (e) {} }
function announce(sigs) {
  const fresh = sigs.filter(s => !seen.has(`${s.kind}|${s.pair}|${s.tf}|${s.candle}`));
  fresh.forEach(s => seen.add(`${s.kind}|${s.pair}|${s.tf}|${s.candle}`));
  lsSet("okx_seen", [...seen].slice(-300));
  if (firstPass) return;
  const loud = fresh.filter(s => s.kind !== "day" || inAppTfs.includes(s.tf));
  if (!loud.length) return;
  const s = loud[0], title = `${s.pair} ${s.tf} ${s.kind === "perp" ? "LONG contract" : s.kind === "swing" ? "SWING long" : "LONG"} entry`;
  const body = `Entry ${px(s.entry)} · TP ${px(s.tp)} · SL ${px(s.sl)} · R:R ${s.rr.toFixed(1)} · ${tm(s.t)} AMS`;
  toast(title + " - " + body); beep();
  if (swReg && "Notification" in window && Notification.permission === "granted") swReg.showNotification(title, {body, tag: `${s.kind}-${s.pair}-${s.tf}`, icon: "icon-192.png"});
}

// ---------- renderers ----------
const fee2 = f => (f * 100).toFixed(f * 100 < 0.1 ? 3 : 2).replace(/0$/, "") + "%";
function warnHtml() { return `<div class="banner bn-amb">Read before you trade<ul>
  <li>1-2 minute scalping is mostly noise, and fees (${X.label}: ${fee2(X.fees.spot)} per side, ${fee2(2 * X.fees.spot)} per round trip) eat small gains. The paper results show it.</li>
  <li>Always use a stop-loss. You tap every trade yourself; this app never places orders.</li>
  <li>Start on the OKX demo account (Demo trading), or the exchange's own demo (Bybit Demo Trading, Kraken Futures demo), before real money.</li>
  <li>Never share codes, passwords or seed phrases, and never let anyone (friends included) set up accounts for you.</li></ul></div>`; }
function errBanner(k) { return S.err[k] ? `<div class="banner bn-red">Couldn't load ${X.label} data: ${esc(S.err[k])}. No prices are shown instead of old or made-up ones; it retries every minute.</div>` : ""; }
function srcLine(extra) { return `<p class="xs mut" style="margin:.4rem 0 0">Prices from <b>${X.label}</b> (${X.quote} pairs)${extra ? " · " + extra : ""}. Fees used: ${esc(X.feeNote)} · <a href="${X.feeSrc}" target="_blank" rel="noopener">source</a>.</p>`; }
function exChips(attr = "data-ex", cur = exName) { return `<div class="chips">${EX_NAMES.map(n => `<button class="chip ${n === cur ? "on" : ""}" ${attr}="${n}">${EX[n].label}</button>`).join("")}</div>`; }
function hiddenNote() { const u = unlisted(); return u.length ? `<p class="xs amb" style="margin:.4rem 0 0">Not listed on ${X.label} (${X.quote}), hidden: ${esc(u.join(", "))}.</p>` : ""; }
function krakenFeeBanner() { return X.name === "kraken" ? `<div class="banner bn-blu">Kraken Pro base fees are high for small trades: ${fee2(X.fees.spot)} taker per side (${fee2(2 * X.fees.spot)} per round trip). Short-timeframe spot trades rarely beat that; the paper results include it.</div>` : ""; }
function biasWhy(d) {
  if (!d || d.close == null) return "not enough data";
  return `${d.close > d.e50 ? "above" : "below"} EMA50 · EMA20 ${d.e20 > d.e50 ? ">" : "<"} EMA50 · EMA50 ${d.e50 > d.e50_prev ? "rising" : "falling"} · RSI ${d.rsi.toFixed(0)}`;
}
function sigCard(s, extra = "") {
  const noise = s.kind === "day" && (s.tf === "1m" || s.tf === "2m");
  return `<div class="sig"><div class="row"><b>${esc(s.pair)}</b><span class="pill p-long">${s.kind === "perp" ? "LONG CONTRACT" : "LONG"}</span><span class="sm">${s.tf}</span>
    ${noise ? `<span class="pill p-amb">NOISE RISK</span>` : ""}<span class="sp"></span><span class="sm mut">${tmd(s.t)} AMS${s.age ? ` · ${s.age} candle${s.age > 1 ? "s" : ""} ago` : ""}</span></div>
    <div class="lv"><div>Entry<b>${px(s.entry)}</b></div><div>Take profit<b class="grn">${px(s.tp)}</b></div><div>Stop-loss<b class="red">${px(s.sl)}</b></div><div>Risk:reward<b>1 : ${s.rr.toFixed(1)}</b></div></div>${extra}
    <div class="row" style="margin-top:.35rem"><span class="sp"></span><button class="chip" data-log="${esc(JSON.stringify({ex: s.ex || exName, pair: s.coin || s.pair, tf: s.tf, kind: s.kind, entry: s.entry, sl: s.sl, tp: s.tp, t: s.t}))}">I took this · log it</button></div></div>`;
}
function sumCells(s) {
  if (!s || !s.n) return `<td class="n">0</td><td class="n">-</td><td class="n">-</td><td class="n">-</td>`;
  return `<td class="n">${s.n}</td><td class="n">${s.win.toFixed(0)}%</td><td class="n">${s.avg_r.toFixed(2)}</td><td class="n ${s.net >= 0 ? "grn" : "red"}">${pct(s.net)}</td>`;
}

function bindTop(el) {

  el.querySelectorAll("[data-go]").forEach(b => b.onclick = () => show(b.dataset.go));

function boxEx() { const f = S.feed; return f ? (f.exchange_label || "OKX") : "-"; }

}

function rulesCard() {
  return `<div class="card"><h2>How the signals work</h2>
  <div class="rule"><b>1. Direction from the 1H chart (day) or the 1D chart (swing)</b><span>LONG when price is above the 50 EMA, the 20 EMA is above the 50 EMA, the 50 EMA is higher than 5 candles ago and RSI(14) is 50 or more. SHORT is the mirror image. Anything else is NEUTRAL: no trades.</span></div>
  <div class="rule"><b>2. Entries only in that direction, long only</b><span>On 1m, 2m, 5m, 10m, 15m, 20m and 30m (4H for swing): the 20 EMA is above the 50 EMA, price dipped to the 20 EMA in the last 3 candles, RSI crosses back up through 50, and the candle closes green above the 20 EMA.</span></div>
  <div class="rule"><b>3. Levels</b><span>Entry = candle close. Stop-loss = 1.5 × ATR(14) below (2 × for swing). Take profit = 3 × ATR above (4 × for swing). That's 1 : 2 risk:reward before fees.</span></div>
  <div class="rule"><b>4. Paper results</b><span>Each signal is bought at its close and sold at the stop, the target, or after 48 candles (60 for swing). If stop and target are both hit in one candle it counts as a stop. Fees are the selected exchange's standard taker fee per side (${X.label}: spot ${fee2(X.fees.spot)}, contracts ${fee2(X.fees.perp)}); contracts also pay or get funding.</span></div>
  <div class="rule"><b>5. Data</b><span>Only public market data from the exchange you pick (OKX, Bybit or Kraken): no keys, no account. Only closed candles are used, so a signal never changes after it appears. Prices differ a little between exchanges; every number says where it came from.</span></div></div>`;
}

function perpBody(P, E, levX) {
  if (!P || P.none) return "";

  const age = P.src === "box" ? `<p class="xs amb" style="margin:.3rem 0">Computed by the box from Kraken Futures ${tmd(P.ts * 1000)} AMS (Kraken Futures can't be read by a browser). Perp last ${px(P.last)} USD.</p>` : "";
  return age + `<div class="row sm" style="margin:.6rem 0 .2rem"><span>${fr}</span><span class="mut">Maintenance margin ${(P.mmr * 100).toFixed(2)}%</span></div>` +
    P.rows.map(r => {
      const liq = r.sig ? liquidation(r.sig.entry, levX, P.mmr) : r.last ? liquidation(r.last, levX, P.mmr) : null;
      const extra = r.sig ? `<p class="xs mut" style="margin:.45rem 0 0">At ${levX}x: liquidation about ${px(liq.price)} (${liq.dist_pct.toFixed(1)}% below entry). The stop is ${((1 - r.sig.sl / r.sig.entry) * 100).toFixed(2)}% below entry, so it should hit long before liquidation. Size it so the stop costs at most 1% of your account.</p>` : "";
      const sm = r.sum || {n: 0};
      return `<h3>${r.tf === "30m" ? "Day · 30m entries, 1H direction" : "Swing · 4H entries, 1D direction"} ${biasPill(r.bias)}</h3>
        ${r.sig ? sigCard(Object.assign({pair: P.id, coin: P.pair, ex: E.name, tf: r.tf, kind: "perp"}, r.sig), extra) : `<p class="sm mut">No long setup now${r.bias !== "long" ? ` (${r.gtf} direction isn't long)` : ""}. At ${levX}x, liquidation would be about ${liq ? liq.dist_pct.toFixed(1) : "-"}% below the current price.</p>`}
        <div class="scroll"><table class="tbl"><tr><th>Paper</th><th class="n">Trades</th><th class="n">Win</th><th class="n">Avg R</th><th class="n">Net</th><th class="n">On ${levX}x margin</th></tr>
        <tr><td class="sm">${r.tf}</td>${sumCells(sm)}<td class="n ${sm.net >= 0 ? "grn" : "red"}">${sm.n ? pct(sm.net * levX) : "-"}</td></tr></table></div>
        <p class="xs mut">${sm.n ? `Fees ${pct(-sm.fees, 2)} (${fee2(E.fees.perp)} per side) and funding ${pct(-sm.fund, 3)} included. ` : ""}Last ${r.n || 300} ${r.tf} candles of ${esc(P.id)} on ${E.label}. Net is per position size; on margin it's multiplied by the leverage.</p>`;
    }).join("");
}

async function backfillMineRegimes() {
  // Tag Mike's on-device logbook from live OKX public data at each entry (trend required; crowd best-effort)
  if (!logbook.length) return;
  const need = logbook.filter(t => !t.regime || t.regime_backfilled);
  if (!need.length) return;
  try {
    // reuse published live rule + per-trade: fetch BTC candles once
    const h1 = await EX.okx.candles("BTC-USDT", "1H");
    const d1 = await EX.okx.candles("BTC-USDT", "1D");
    let fundSeries = [], lsSeries = [];
    try {
      const d = await okxGet("https://www.okx.com/api/v5/public/funding-rate-history?instId=BTC-USDT-SWAP&limit=100");
      fundSeries = d.map(x => [+x.fundingTime, +(x.realizedRate || x.fundingRate)]).sort((a, b) => a[0] - b[0]);
    } catch (e) {}
    try {
      const d = await okxGet("https://www.okx.com/api/v5/rubik/stat/contracts/long-short-account-ratio?ccy=BTC&period=1H");
      lsSeries = d.map(x => [+x[0], +x[1]]).sort((a, b) => a[0] - b[0]);
    } catch (e) {}
    const nearest = (series, t, skew) => { let best = null; for (const [tt, v] of series) { if (tt <= t) best = [tt, v]; else break; } return best && t - best[0] <= skew ? best[1] : null; };
    const detailAt = (c, tf, t) => {
      const tfm = TF_MS[tf], cut = c.filter(k => k[0] + tfm <= t);
      if (cut.length < WARMUP + 1) return null;
      return biasDetail(cut, tf);
    };
    for (const tr of logbook) {
      if (tr.regime && !tr.regime_backfilled) continue;
      const t = tr.t;
      const h = detailAt(h1, "1H", t), d = detailAt(d1, "1D", t);
      const funding = nearest(fundSeries, t, 16 * 3600000), ls = nearest(lsSeries, t, 6 * 3600000);
      let regime = "Unknown", reason = "mixed";
      if (h && d && h.bias === "long" && d.bias === "long") {
        if ((funding == null || funding <= 0.0001) && (ls == null || ls <= 2.5)) { regime = "Bull"; reason = "trends_up"; }
        else reason = "bull_blocked";
      } else if (h && d && h.bias === "short" && d.bias === "short") {
        if ((funding == null || funding >= -0.0001) && (ls == null || ls >= 0.7)) { regime = "Bear"; reason = "trends_down"; }
        else reason = "bear_blocked";
      } else if (!h || !d) reason = "missing_trend";
      else reason = `mixed:${h && h.bias}/${d && d.bias}`;
      tr.regime = regime;
      tr.regime_backfilled = true;
      tr.regime_inputs = { h1_bias: h && h.bias, d1_bias: d && d.bias, funding, ls_ratio: ls, reason };
    }
    await saveLog(logbook);
  } catch (e) { console.warn("regime backfill mine", e); }
}

function sparkSVG(closes, up) {
  if (!closes || closes.length < 2) return `<svg viewBox="0 0 120 42" preserveAspectRatio="none"><text x="4" y="24" fill="currentColor" font-size="10" opacity=".5">…</text></svg>`;
  const w = 120, h = 42, pad = 2;
  let mn = Math.min(...closes), mx = Math.max(...closes); if (mx === mn) { mn -= 1; mx += 1; }
  const pts = closes.map((c, i) => {
    const x = pad + i * (w - 2 * pad) / (closes.length - 1);

  }).join(" ");

function destroyCoinChart() {
  try { if (coinPage.chart) coinPage.chart.remove(); } catch (e) {}
  coinPage.chart = coinPage.series = coinPage.e20 = coinPage.e50 = null;
}
function buildCoinChart(candles) {
  destroyCoinChart();
  const el = $("coinChart"); if (!el || !window.LightweightCharts) return;
  const dark = document.documentElement.dataset.theme !== "light";
  const chart = LightweightCharts.createChart(el, {
    width: el.clientWidth, height: el.clientHeight || 320,
    layout: { background: { color: "transparent" }, textColor: dark ? "#8a94a3" : "#5d6775" },
    grid: { vertLines: { color: dark ? "#1a2029" : "#e8edf3" }, horzLines: { color: dark ? "#1a2029" : "#e8edf3" } },
    rightPriceScale: { borderVisible: false },
    timeScale: { borderVisible: false, timeVisible: true, secondsVisible: false },
    crosshair: { mode: 0 },
  });
  const series = chart.addCandlestickSeries({
    upColor: "#2fd27a", downColor: "#ff5468", borderUpColor: "#2fd27a", borderDownColor: "#ff5468",
    wickUpColor: "#2fd27a", wickDownColor: "#ff5468",
  });
  const e20s = chart.addLineSeries({ color: "#5aa9ff", lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
  const e50s = chart.addLineSeries({ color: "#ffb648", lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
  const ind = indicators(candles);
  const bars = candles.map(k => ({ time: Math.floor(k[0] / 1000), open: k[1], high: k[2], low: k[3], close: k[4] }));
  const l20 = candles.map((k, i) => ind.e20[i] != null ? { time: Math.floor(k[0] / 1000), value: ind.e20[i] } : null).filter(Boolean);
  const l50 = candles.map((k, i) => ind.e50[i] != null ? { time: Math.floor(k[0] / 1000), value: ind.e50[i] } : null).filter(Boolean);
  series.setData(bars); e20s.setData(l20); e50s.setData(l50);
  chart.timeScale().fitContent();
  coinPage.chart = chart; coinPage.series = series; coinPage.e20 = e20s; coinPage.e50 = e50s;
  if (coinPage._ro) coinPage._ro.disconnect();
  coinPage._ro = new ResizeObserver(() => { try { chart.applyOptions({ width: el.clientWidth, height: el.clientHeight || 320 }); } catch (e) {} });
  coinPage._ro.observe(el);
}
async function loadCoinPage() {
  const coin = coinPage.coin; if (!coin) return;
  const inst = X.spotId(coin);
  if (!inst) { S.err.coin = `${X.label} has no ${coin}/${X.quote} spot pair.`; return renderCoin(); }
  try {
    const [tick] = await X.tickers([inst]);
    S.tick[coin] = tick;
    const c = await X.candles(inst, coinPage.tf);
    coinPage.candles = c;
    if (!S.h1[coin] || coinPage.tf === "1H") { if (coinPage.tf === "1H") S.h1[coin] = c; }
    if (!S.bias[coin]) {
      const h = coinPage.tf === "1H" ? c : await X.candles(inst, "1H");
      S.h1[coin] = h; S.bias[coin] = biasDetail(h, "1H");
    }
    // recent signals across day TFs (lightweight: only if we already have bias)
    const gate = gateFn(S.h1[coin], "1H");
    const sigs = [];
    for (const tf of ["5m", "15m", "30m", "1H"]) {
      try {
        const cc = tf === coinPage.tf ? c : await X.candles(inst, tf);
        const s = latestSignal(cc, tf, gate, DAY);
        if (s) sigs.push(Object.assign({ pair: coin, tf, kind: "day" }, s));
      } catch (e) {}
    }
    coinPage.sigs = sigs;
    S.err.coin = null;
  } catch (e) { S.err.coin = e.message; }
}

  const el = $("v-coin"); if (!el) return;

  if (!coin) { el.innerHTML = `<div class="term"><div class="tpanel"><p class="mono mut">No coin selected.</p><button class="coin-head back" data-dashhome type="button">← Floor</button></div></div>`; bindDashNav(el); return; }
  const tk = S.tick[coin] || {}, b = S.bias[coin], band = bandOf(tk.last);

  const tfs = COIN_TFS.map(tf => `<button class="chip ${tf === coinPage.tf ? "on" : ""}" data-ctf="${tf}">${tf === "1H" ? "1h" : tf === "4H" ? "4h" : tf === "1D" ? "1D" : tf}</button>`).join("");
  const sigs = (coinPage.sigs || []).map(s => sigCard(s)).join("") || `<p class="mono mut">No fresh day signal on 5m/15m/30m/1H right now.</p>`;
  el.innerHTML = `<div class="term">${tickerHTML()}

      <div class="tpanel span2"><h3><span class="num">3</span> Live chart · ${esc(coinPage.tf)} · EMA20/50</h3>
        <div class="tfbar">${tfs}<span class="mono mut" style="align-self:center;margin-left:.3rem">EMA20 blue · EMA50 amber</span></div>
        ${S.err.coin ? `<div class="banner bn-red">${esc(S.err.coin)}</div>` : ""}
        <div id="coinChart"></div>
        <p class="mono mut" style="margin:.35rem 0 0">Closed ${X.label} candles only. Own page route <code>#/coin/${esc(coin)}</code>.</p>
      </div>

  el.querySelectorAll("[data-ctf]").forEach(btn => btn.onclick = () => {

}

function parseRoute() {
  const h = location.hash || "";
  let m = /^#\/coin\/([A-Za-z0-9]{2,12})(?:-USDT)?\/?$/i.exec(h);
  if (m) { const c = normCoin(m[1]); return c ? { kind: "coin", coin: c } : null; }
  m = /^#\/dash\/(low|mid|high|all)\/?$/i.exec(h);
  if (m) return { kind: "band", band: m[1].toLowerCase() };
  if (/^#\/dash\/?$/i.test(h)) return { kind: "dash" };
  return null;
}
function navigate(r, replace) {
  let hash = "#/dash";
  if (r.kind === "coin") hash = "#/coin/" + r.coin;
  else if (r.kind === "band") hash = "#/dash/" + r.band;
  else if (r.kind === "dash") hash = "#/dash";
  if (replace) history.replaceState(null, "", location.pathname + location.search + hash);
  else if (location.hash !== hash) location.hash = hash;
  else applyRoute();
}
function applyRoute() {
  const r = parseRoute();
  if (!r) return false;
  if (r.kind === "coin") {
    dashBand = null; coinPage.coin = r.coin; coinPage.tf = coinPage.tf || "1H";
    view = "coin"; lsSet("okx_view", "dash");
    document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-coin"));
    document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === "dash"));
    renderCoin();
    loadCoinPage().then(() => { renderCoin(); if (coinPage.candles) buildCoinChart(coinPage.candles); });
    return true;
  }
  destroyCoinChart(); coinPage.coin = null;
  dashBand = r.kind === "band" ? r.band : null;
  view = "dash"; lsSet("okx_view", "dash");
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-dash"));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === "dash"));
  RENDER.dash(); refresh(true);
  return true;
}
window.addEventListener("hashchange", () => {
  if (!started) return;
  if (parseRoute()) applyRoute();
  else if (view === "coin" || view === "dash") { /* keep */ }
});

// ---------- shell ----------
const RENDER = {dash: renderDash, coin: renderCoin, day: renderDay, an: renderAnalyze, log: renderLog, swing: renderSwing, perp: renderPerp, port: renderPort, set: renderSet};
function show(v) {
  if (v === "dash") { navigate({ kind: dashBand ? "band" : "dash", band: dashBand || undefined }); return; }
  if (v === "coin") { if (coinPage.coin) navigate({ kind: "coin", coin: coinPage.coin }); else navigate({ kind: "dash" }); return; }
  destroyCoinChart(); coinPage.coin = null; dashBand = null;
  if (/^#\/(dash|coin)\//.test(location.hash) || location.hash === "#/dash") history.replaceState(null, "", location.pathname + location.search);
  view = v; lsSet("okx_view", v);
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  RENDER[v](); refresh(true);
}
let busy = false, again = false;
async function refresh(force) {
  if (busy) { if (force) again = true; return; }
  if (!force && document.hidden) return; busy = true;
  const v = view;
  try {
    const all = [];
    if (v === "an") { if (!S.feed) await loadFeed(); return; }
    if (v === "log") {
      if (!S.feed) await loadFeed();
      await loadRegimeFeed();
      await backfillMineRegimes();
      S.at = Date.now();
    } else if (v === "coin") {
      try { await loadCoinPage(); } catch (e) { S.err.coin = e.message; }
      S.at = Date.now();
    } else {
      const ex0 = exName;
      try { await loadDay(); S.err.day = null; all.push(...S.sigs); } catch (e) { S.err.day = e.message; }
      if (v === "dash") {
        if (!paperBot) await loadPaperBot();
      }
      if (v === "swing" || Date.now() - S.swAt > 600000) { try { await loadSwing(); S.err.swing = null; } catch (e) { S.err.swing = e.message; } }
      listed().forEach(p => S.swing[p] && S.swing[p].sig && all.push(Object.assign({pair: p, tf: "4H", kind: "swing"}, S.swing[p].sig)));
      if (v === "perp") { try { if (!X.perpInBrowser && !S.feed) await loadFeed(); all.push(...await loadPerp()); S.err.perp = null; } catch (e) { S.err.perp = e.message; } }
      if (v === "port") { try { await loadPort(); S.err.port = null; } catch (e) { S.err.port = e.message; } }
      if (!S.feed || Date.now() - S.at > 300000) await loadFeed();
      if (ex0 !== exName) return;                     // switched exchange mid-load: the new load takes over
      announce(all); firstPass = false; S.at = Date.now();
    }
  } finally { busy = false; if (again) { again = false; setTimeout(() => refresh(true), 0); } }
  $("upd").textContent = (view === "an" || view === "log") ? (view === "log" ? "Logbook · " : "Analyze · ") + tm(Date.now())
    : view === "coin" ? (coinPage.coin || "Coin") + " · " + tm(Date.now())
    : view === "dash" ? "Dash · " + tm(Date.now())
    : S.err.day ? "data error" : "Live · " + tm(Date.now());
  if (view === v && RENDER[v]) RENDER[v]();
  if (view === "coin" && v === "coin" && coinPage.candles) setTimeout(() => buildCoinChart(coinPage.candles), 30);
}
const THEMES = ["auto", "dark", "light"];
function applyTheme() { const p = localStorage.getItem("okx_theme") || "auto", h = +new Intl.DateTimeFormat("en-GB", {hour: "2-digit", hourCycle: "h23", timeZone: "Europe/Amsterdam"}).format(new Date());
  document.documentElement.dataset.theme = p === "auto" ? (h >= 22 || h < 7 ? "light" : "dark") : p; $("theme").textContent = p[0].toUpperCase() + p.slice(1); }
$("theme").onclick = () => { const p = localStorage.getItem("okx_theme") || "auto"; localStorage.setItem("okx_theme", THEMES[(THEMES.indexOf(p) + 1) % 3]); applyTheme(); };
applyTheme(); setInterval(applyTheme, 60000);
let started = false;
async function start() {
  if (started) return; started = true;

}
(async function boot() {
  try { KEYS = await (await fetch("keys.json", {cache: "no-store"})).json(); } catch (e) { KEYS = null; }
  const h = location.hash;
  if (h.startsWith("#reset=")) {
    history.replaceState(null, "", location.pathname + location.search);
    let r; try { r = await verifyReset(h.slice(7), KEYS && KEYS.reset, Date.now(), ls("okx_used_resets", [])); } catch (e) { r = {err: "This reset link is not valid."}; }
    if (r.nonce) { lockScreen.nonce = r.nonce; return lockScreen("reset"); }
    return lockScreen(ls("okx_auth") ? "login" : "set", r.err);
  }
  if (!ls("okx_auth")) return lockScreen("set");
  if (await resumeSession()) return start();
  lockScreen("login");
})();
